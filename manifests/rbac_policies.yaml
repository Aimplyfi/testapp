apiVersion: v1
kind: ServiceAccount
metadata:
  name: restricted-user
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restricted-pod-access
rules:

# Allow basic pod visibility
- apiGroups: [""]
  resources:
    - pods
    - pods/log
  verbs:
    - get
    - list
    - watch

# Explicitly prevent exec
- apiGroups: [""]
  resources:
    - pods/exec
  verbs: []

# Explicitly prevent attach
- apiGroups: [""]
  resources:
    - pods/attach
  verbs: []

# Prevent port-forward
- apiGroups: [""]
  resources:
    - pods/portforward
  verbs: []

# Prevent ephemeral debug containers
- apiGroups: [""]
  resources:
    - pods/ephemeralcontainers
  verbs: []

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restricted-pod-access-binding
subjects:
- kind: ServiceAccount
  name: restricted-user
roleRef:
  kind: Role
  name: restricted-pod-access
  apiGroup: rbac.authorization.k8s.io