# jwt-secret-job.yaml
#
# One-time Job that generates a cryptographically random 64-byte
# HMAC-SHA256 secret and stores it in the Secret "vuln-jwt-secret"
# in namespace testns. Both the server and client mount this Secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: jwt-secret-init
  namespace: testns
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: true
      serviceAccountName: cert-init-sa   # reuse existing SA — already has Secret perms
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: jwt-gen
        image: bitnami/kubectl:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -exc
        - |
          # Generate 64 bytes of random data, base64-encode to a safe string.
          # tr removes characters that would confuse shell quoting or YAML.
          SECRET=$(openssl rand -base64 64 | tr -d '\n/+=')

          echo "JWT secret length: ${#SECRET} chars"

          kubectl create secret generic vuln-jwt-secret \
            --from-literal=jwt.secret="$SECRET" \
            --namespace=testns \
            --dry-run=client -o yaml | kubectl apply -n testns -f -

          # Restart both deployments so they pick up the new secret
          kubectl rollout restart deployment/vuln-server    -n testns
          kubectl rollout restart deployment/exploit-client -n testns

          echo "JWT secret stored in Secret 'vuln-jwt-secret' (namespace: testns)"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
