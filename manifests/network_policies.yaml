# -------------------------
# Default deny all ingress
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: testns
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# -------------------------
# Default deny all egress
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: testns
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
# -------------------------
# Allow client → server (HTTPS/TLS on 8443)
# Matches on pod IP — kube-proxy rewrites Service VIP to pod IP
# before the network policy is evaluated on the receiving pod.
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-to-server
  namespace: testns
spec:
  podSelector:
    matchLabels:
      app: vuln-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: exploit-client
    ports:
    - protocol: TCP
      port: 8443
---
# -------------------------
# Allow client egress → server on 443 (Service port) and 8443 (pod port)
# The client connects to the Service ClusterIP on port 443. kube-proxy
# DNAT rewrites this to the pod IP:8443, but on some CNI implementations
# (e.g. Cilium, kube-proxy in iptables mode) the egress NetworkPolicy is
# evaluated BEFORE DNAT on the client node — so the destination seen by
# the policy is still ClusterIP:443. Both ports must be permitted to
# cover all CNI implementations.
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-egress-to-server
  namespace: testns
spec:
  podSelector:
    matchLabels:
      app: exploit-client
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: vuln-server
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8443
---
# -------------------------
# Allow server egress reply → client
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-server-egress
  namespace: testns
spec:
  podSelector:
    matchLabels:
      app: vuln-server
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: exploit-client
---
# -------------------------
# Allow DNS resolution (both pods)
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: testns
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
