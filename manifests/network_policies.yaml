# -------------------------
# Default deny all ingress
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: testns
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# -------------------------
# Default deny all egress
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: testns
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
# -------------------------
# Allow internal client → server (pod-to-pod, HTTPS on 8443)
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-to-server
  namespace: testns
spec:
  podSelector:
    matchLabels:
      app: vuln-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: exploit-client
    ports:
    - protocol: TCP
      port: 8443
---
# -------------------------
# Allow external ingress → server on 8443
# External traffic arrives from the LoadBalancer / node via the host
# network — it has no pod label so podSelector cannot match it.
# An empty `from: []` block allows ingress from any source (including
# the LB health-check probes and external clients). Scoped to port 8443
# only; all other ports remain denied by the default-deny rule above.
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-server
  namespace: testns
spec:
  podSelector:
    matchLabels:
      app: vuln-server
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8443
---
# -------------------------
# Allow client egress → server on 443 (Service ClusterIP) and 8443 (pod IP)
# Both ports are needed because some CNI implementations evaluate egress
# policy before kube-proxy DNAT rewrites ClusterIP:443 → podIP:8443.
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client-egress-to-server
  namespace: testns
spec:
  podSelector:
    matchLabels:
      app: exploit-client
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: vuln-server
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8443
---
# -------------------------
# Allow server egress reply → internal client
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-server-egress
  namespace: testns
spec:
  podSelector:
    matchLabels:
      app: vuln-server
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: exploit-client
---
# -------------------------
# Allow DNS resolution (all pods)
# -------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: testns
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
