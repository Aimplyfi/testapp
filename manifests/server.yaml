apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-server
  namespace: testns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-server
  template:
    metadata:
      labels:
        app: vuln-server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: server
        image: vuln-server:1.0
        imagePullPolicy: IfNotPresent
        # Uvicorn is the ASGI server; it owns TLS termination directly.
        # Run via __main__ so the explicit ssl.SSLContext (with ALPN) is used.
        # When uvicorn is invoked via CLI flags alone it skips ALPN negotiation,
        # which causes requests/urllib3 clients to fail the TLS handshake.
        command:
        - python3
        - app.py
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8443
          name: https
        env:
        - name: SERVER_URL
          value: "https://vuln-server-service/run"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        # TLS certificate and key served by Uvicorn
        - name: server-tls
          mountPath: /tls
          readOnly: true
        # JWT shared secret for verifying incoming Bearer tokens
        - name: jwt-secret
          mountPath: /jwt
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
      # Secret created by cert-init-job.yaml (or cert-manager in production)
      - name: server-tls
        secret:
          secretName: vuln-server-tls
          defaultMode: 0400
      # JWT shared secret — readable by owner only
      - name: jwt-secret
        secret:
          secretName: vuln-jwt-secret
          defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: vuln-server-service
  namespace: testns
  # No cloud-provider annotations here — this manifest works on both kind
  # (via MetalLB) and cloud clusters (AWS/GCP/Azure native LB controllers).
  # Add cloud-specific annotations (e.g. aws-load-balancer-type) in an
  # overlay or patch file for cloud deployments.
spec:
  type: LoadBalancer
  # externalTrafficPolicy: Local preserves the real client source IP and
  # avoids a second node hop. Works correctly with MetalLB L2 mode because
  # MetalLB always routes traffic to a node that has a ready pod endpoint.
  externalTrafficPolicy: Local
  selector:
    app: vuln-server
  ports:
  - name: https
    protocol: TCP
    port: 443
    targetPort: 8443
